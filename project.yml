# XcodeGen spec — generates VekturModular.xcodeproj.
#   brew install xcodegen && xcodegen generate
# The .xcodeproj is a build artefact: edit this file, not the project.
name: VekturModular

options:
  bundleIdPrefix: com.dmtcymatics
  # TestFlight / App Store builds use the iOS 27 / macOS 27 SDK or later
  # (enforced for Release by tools/check_sdk.sh in both targets).
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      GCC_OPTIMIZATION_LEVEL: s

packages:
  VekturKit:
    path: Packages/VekturKit
  # AudioKit is intentionally NOT linked in Phase 1 — see docs/ARCHITECTURE.md §2.3.
  # AudioKit:
  #   url: https://github.com/AudioKit/AudioKit
  #   from: 5.6.0

targets:

  # ---------------------------------------------------------------- App
  VekturModular:
    type: application
    platform: [iOS, macOS]
    preBuildScripts:
      - name: Require iOS/macOS 27 SDK for release
        script: "\"$SRCROOT/tools/check_sdk.sh\""
        basedOnDependencyAnalysis: false
        inputFiles: [$(SRCROOT)/tools/check_sdk.sh]   # declared: user-script sandboxing is on
    sources:
      - path: App
    dependencies:
      - target: VekturModularAU_${platform}
        embed: true
        codeSign: true
      - package: VekturKit
        product: VekturEngine
      - package: VekturKit
        product: VekturUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VK_BUNDLE_ID_PREFIX).vekturmodular
        PRODUCT_NAME: Vektur Modular
        PRODUCT_MODULE_NAME: VekturModular
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Vektur Modular
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon           # DMT Cymatics logo (App/Assets.xcassets)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor   # panel amber, as the web build
    info:
      path: App/Generated/Info-${platform}.plist
      properties:
        CFBundleDisplayName: Vektur Modular
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        ITSAppUsesNonExemptEncryption: false
        # Phase 9: recordings in Documents/Recordings are visible in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Phase 7: Ableton Link finds peers on the local network.
        NSLocalNetworkUsageDescription: Vektur Modular uses the local network to sync tempo and start/stop with other Ableton Link apps.
        # Phase 7: MIDI Learn profiles (.vekturmidi, JSON)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.dmtcymatics.vekturmodular.midi-profile
            UTTypeDescription: Vektur MIDI Profile
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [vekturmidi]
          - UTTypeIdentifier: com.dmtcymatics.vekturmodular.preset
            UTTypeDescription: Vektur Preset
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [vekturpreset]
          - UTTypeIdentifier: com.dmtcymatics.vekturmodular.project
            UTTypeDescription: Vektur Project
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [vekturproject]
          - UTTypeIdentifier: com.dmtcymatics.vekturmodular.pattern
            UTTypeDescription: Vektur Pattern
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [vekturpattern]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Vektur MIDI Profile
            LSItemContentTypes: [com.dmtcymatics.vekturmodular.midi-profile]
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
          - CFBundleTypeName: Vektur Preset
            LSItemContentTypes: [com.dmtcymatics.vekturmodular.preset]
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
          - CFBundleTypeName: Vektur Project
            LSItemContentTypes: [com.dmtcymatics.vekturmodular.project]
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
          - CFBundleTypeName: Vektur Pattern
            LSItemContentTypes: [com.dmtcymatics.vekturmodular.pattern]
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
    entitlements:
      path: App/Generated/App-${platform}.entitlements
      properties:
        com.apple.security.app-sandbox: true   # ignored on iOS, required on macOS
        com.apple.security.files.user-selected.read-write: true
        # Phase 6: shared user-IR library (register the group for the team first)
        com.apple.security.application-groups: [group.com.dmtcymatics.vekturmodular]
        # Phase 7 (macOS): CoreMIDI virtual source + Link sockets in the sandbox.
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        # Phase 7 (iOS, Ableton Link): uncomment once Apple has granted the
        # multicast entitlement to the team (developer.apple.com/contact/request/networking-multicast).
        # com.apple.developer.networking.multicast: true
    # Ableton Link: add LinkKit.xcframework (Ableton licence required) as
    #   - framework: Vendor/LinkKit.xcframework
    # under this target's dependencies; LinkTransport.swift then compiles it in.

  # ---------------------------------------------------------------- AUv3 extension
  VekturModularAU:
    type: app-extension
    platform: [iOS, macOS]
    preBuildScripts:
      - name: Require iOS/macOS 27 SDK for release
        script: "\"$SRCROOT/tools/check_sdk.sh\""
        basedOnDependencyAnalysis: false
        inputFiles: [$(SRCROOT)/tools/check_sdk.sh]   # declared: user-script sandboxing is on
    sources:
      - path: AUExtension
    dependencies:
      - package: VekturKit
        product: VekturAudioUnit
      - package: VekturKit
        product: VekturUI
      - sdk: CoreAudioKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VK_BUNDLE_ID_PREFIX).vekturmodular.au
        PRODUCT_NAME: VekturModularAU
        PRODUCT_MODULE_NAME: VekturModularAU
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: AUExtension/Generated/Info-${platform}.plist
      properties:
        CFBundleDisplayName: Vektur Modular
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.dmtcymatics.vekturmodular.midi-profile
            UTTypeDescription: Vektur MIDI Profile
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [vekturmidi]
          - UTTypeIdentifier: com.dmtcymatics.vekturmodular.preset
            UTTypeDescription: Vektur Preset
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [vekturpreset]
          - UTTypeIdentifier: com.dmtcymatics.vekturmodular.project
            UTTypeDescription: Vektur Project
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [vekturproject]
          - UTTypeIdentifier: com.dmtcymatics.vekturmodular.pattern
            UTTypeDescription: Vektur Pattern
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [vekturpattern]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AudioUnitViewController
          NSExtensionAttributes:
            AudioComponents:
              # MUST match VekturAudioUnit/AudioComponentInfo.swift. Never change after release.
              - type: aumu
                subtype: VkMd
                manufacturer: DMTc
                name: "DMT Cymatics: Vektur Modular"
                description: Vintage modular analogue synthesiser
                version: 65536        # 1.0.0 → (1<<16)|(0<<8)|0
                sandboxSafe: true
                tags: [Synthesizer, MIDI]
    entitlements:
      path: AUExtension/Generated/AU-${platform}.entitlements
      properties:
        com.apple.security.app-sandbox: true   # mandatory for AUv3 on macOS
        com.apple.security.files.user-selected.read-write: true   # load IR files; import/export MIDI profiles (Phase 7)
        com.apple.security.application-groups: [group.com.dmtcymatics.vekturmodular]

  # Package tests (VekturCoreTests, VekturDSPTests, VekturAudioUnitTests) run with
  #   cd Packages/VekturKit && swift test
  # or by opening Packages/VekturKit/Package.swift in Xcode (⌘U).

schemes:
  VekturModular_iOS:
    build:
      targets:
        VekturModular_iOS: all
    run:
      config: Debug
  VekturModular_macOS:
    build:
      targets:
        VekturModular_macOS: all
